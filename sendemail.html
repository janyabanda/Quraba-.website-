<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Save and Send Textbox</title>
   <style>
       body { font-family: Arial, sans-serif; margin: 40px; }
       .form-container { max-width: 400px; }
       textarea { width: 100%; height: 150px; margin-bottom: 10px; padding: 10px; }
       button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; }
       button:hover { background-color: #0056b3; }
   </style>
</head>
<body>
 
   <div class="form-container">
       <h2>Send Message to Email</h2>
       <!-- REPLACE THE ACTION URL WITH YOUR FORMSPREE ENDPOINT -->
       <form action="https://formspree.io/f/xbgljdzr" method="POST">
           <label for="message">Your Message:</label>
           <textarea id="message" name="message" placeholder="Type something here..." required></textarea>
           <button type="submit">Send to Email</button>
       </form>
   </div>
<form id="dataForm">
 <table border="1" cellpadding="8">
   <thead>
     <tr>
       <th>Select</th>
       <th>Item</th>
       <th>Details / Value</th>
     </tr>
   </thead>
   <tbody>
     <tr>
       <td><input type="checkbox" name="item" value="Apple"></td>
       <td>Apple</td>
       <td><input type="text" name="details" placeholder="Enter quantity or note"></td>
     </tr>
     <tr>
       <td><input type="checkbox" name="item" value="Banana"></td>
       <td>Banana</td>
       <td><input type="text" name="details" placeholder="Enter quantity or note"></td>
     </tr>
     <tr>
       <td><input type="checkbox" name="item" value="Orange"></td>
       <td>Orange</td>
       <td><input type="text" name="details" placeholder="Enter quantity or note"></td>
     </tr>
   </tbody>
 </table>
 <br>
 <button type="button" onclick="saveToMessage()">Save to Message</button>
</form>
 
<h3>Saved Message:</h3>
<textarea id="outputMessage" rows="6" cols="40" readonly></textarea>
 
<script>
function saveToMessage() {
 const rows = document.querySelectorAll("#dataForm tbody tr");
 let message = "Selected Items:\n";
 
 rows.forEach(row => {
   const checkbox = row.querySelector('input[type="checkbox"]');
   const textbox = row.querySelector('input[type="text"]');
   
   if (checkbox.checked) {
     message += `- ${checkbox.value}: ${textbox.value || "No details"}\n`;
   }
 });
 
 document.getElementById("outputMessage").value = message;
}
</script>

 
</body>
</html>
